name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, 'pipeline/**', 'ui/**', 'data/**']
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  frontend:
    name: frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  pipeline:
    name: pipeline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.0'
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --locked --python 3.11
      - run: uv run --no-sync python -m pipeline.science_results --verify
      - run: uv run --no-sync python -m pipeline.validate_contract
      - run: uv run --no-sync pytest
      - name: Generate and validate synthetic handoff bundle
        run: uv run --no-sync python -m pipeline.run --output pipeline/output/ci-synthetic
      - uses: actions/upload-artifact@v4
        with:
          name: synthetic-contract-data
          path: pipeline/output/ci-synthetic/
          retention-days: 7

  full-suite:
    name: full-suite
    needs: [frontend, pipeline]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require all checks to pass
        env:
          FRONTEND_RESULT: ${{ needs.frontend.result }}
          PIPELINE_RESULT: ${{ needs.pipeline.result }}
        run: |
          test "$FRONTEND_RESULT" = success
          test "$PIPELINE_RESULT" = success
