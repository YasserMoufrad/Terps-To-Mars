name: Delete merged PR branch

on:
  pull_request_target:
    types: [closed]

permissions:
  contents: write

jobs:
  delete-branch:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      # Do not check out or execute PR code in this privileged workflow.
      - uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const repository = context.payload.repository;
            const branch = pr.head.ref;
            if (pr.head.repo?.full_name !== repository.full_name ||
                branch === repository.default_branch || branch === pr.base.ref) {
              core.info('Keeping default, base, or fork branch.');
              return;
            }
            const ref = `heads/${branch}`;
            try {
              const current = await github.rest.git.getRef({ ...context.repo, ref });
              if (current.data.object.sha !== pr.head.sha) {
                core.info('Keeping branch because it contains newer commits.');
                return;
              }
              await github.rest.git.deleteRef({ ...context.repo, ref });
              core.info(`Deleted merged branch ${branch}`);
            } catch (error) {
              if (error.status !== 404) throw error;
              core.info('Branch already deleted.');
            }
