[project]
name = "terps-to-mars-pipeline"
version = "0.1.0"
description = "Mars terrain, hazard and route planning tools"
requires-python = ">=3.11,<3.14"
dependencies = [
  "numpy==2.2.6",
  "rasterio==1.4.3",
  "scikit-image==0.25.2",
  "scipy==1.17.1",
  "pillow==13.0.0",
  "affine==2.4.0",
]

[dependency-groups]
dev = ["pytest==8.4.2"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["pipeline/tests"]
pythonpath = ["."]
